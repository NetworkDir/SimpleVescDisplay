; SimpleVescDisplay v2 - PlatformIO project
; Pick the environment that matches your board, e.g.
;   pio run -e esp32-3248s035c -t upload
;
; The Arduino IDE can build the same sources: see README.md.

[platformio]
src_dir = firmware/SimpleVescDisplay
default_envs = esp32-3248s035c

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    lvgl/lvgl@9.6.0
    h2zero/NimBLE-Arduino@^2.2.3
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Ifirmware
    -DCORE_DEBUG_LEVEL=0

[env:esp32-2432s028r]
build_flags = ${env.build_flags} -DBOARD_ESP32_2432S028R

[env:esp32-2432s028r-st7789]
build_flags = ${env.build_flags} -DBOARD_ESP32_2432S028R_ST7789

[env:esp32-3248s035r]
build_flags = ${env.build_flags} -DBOARD_ESP32_3248S035R

[env:esp32-3248s035c]
build_flags = ${env.build_flags} -DBOARD_ESP32_3248S035C
